[tool.poetry]
name = "nexa-databricks-api"
version = "0.0.2"
description = "Nexa Databricks API"
authors = ["Nexa Team <team@nexa.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.121.0"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
sqlalchemy = "^2.0.23"
pydantic = "^2.12.0"
python-multipart = "^0.0.20"
httpx = "^0.28.0"
python-dotenv = "^1.2.0"
requests = "^2.31.0"
aiofiles = "^25.1.0"
jinja2 = "^3.1.2"
pyjwt = "^2.8.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pydantic-settings = "^2.4.0"
aiohttp = "^3.13.0"
pyyaml = "^6.0"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.9"
greenlet = "^3.0.3"
sqlmodel = "^0.0.27"
alembic = "^1.17.0"
boto3 = "^1.40.72"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.0"
pytest-mock = "^3.12.0"
black = "^25.9.0"
isort = "^7.0.0"
flake8 = "^7.3.0"
mypy = "^1.7.1"
pre-commit = "^4.4.0"
pytest-cov = "^7.0.0"
pytest-benchmark = "^5.2.0"
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.23"
mkdocstrings = {extras = ["python"], version = "^0.30.0"}
ruff = "^0.14.0"
bandit = "^1.7.5"

[tool.poetry.group.databricks.dependencies]
databricks-sdk = "^0.73.0"
databricks-sql-connector = "^4.1.4"

[tool.poetry.group.git.dependencies]
pygithub = "^2.8.0"
python-gitlab = "^7.0.0"
azure-devops = "^7.1.0b4"

[tool.poetry.group.monitoring.dependencies]
prometheus-client = "^0.23.0"
structlog = "^25.5.0"

[tool.poetry.group.contract-testing.dependencies]
pytest-mock = "^3.12.0"
pyyaml = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "asyncpg>=0.30.0",
]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''


[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "databricks.*",
    "azure.*",
    "github.*",
    "gitlab.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "contract: marks tests as contract tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "src/__pycache__/*",
    "*/migrations/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Ruff configuration disabled

[tool.bandit]
exclude_dirs = ["tests", "src/tests"]
skips = ["B101", "B601"]
